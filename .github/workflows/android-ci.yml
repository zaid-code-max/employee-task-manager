name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/task-list]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Run unit tests and build Debug APK
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: employee-task-manager-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
